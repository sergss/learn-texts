<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Sivka-Burka Easy English</title>
    <style>
        :root {
            --bg-teal: #48C9B0;
            --card-bg: #FFFFFF;
            --btn-blue: #3498DB;
            --btn-blue-shadow: #2980B9;
            --btn-red: #E74C3C;
            --btn-red-shadow: #C0392B;
            --btn-yellow: #F1C40F;
            --btn-yellow-shadow: #F39C12;
            --btn-green: #2ECC71;
            --btn-green-shadow: #27AE60;
            --btn-purple: #9B59B6;
            --btn-purple-shadow: #8E44AD;
            --text-color: #2C3E50;
        }

        body {
            /* Added Noto Color Emoji for Android support */
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Noto Color Emoji', 'Apple Color Emoji', sans-serif;
            background-color: var(--bg-teal);
            background-image: radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 20px 20px;
            padding: 10px;
            text-align: center;
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        h1 {
            margin: 5px 0 15px 0;
            font-size: 2rem;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px #eee;
        }
        
        .title-word span { display: inline-block; }
        .color-e { color: var(--btn-blue); }
        .color-a { color: var(--btn-red); }
        .color-s { color: var(--btn-yellow); }
        .color-y { color: var(--btn-green); }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ECF0F1;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .progress-indicator {
            font-weight: bold;
            color: #7F8C8D;
            font-size: 1rem;
        }

        .scene-container {
            border: 3px solid #BDC3C7;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #fff;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .game-area {
            min-height: 70px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .sentence-display {
            font-size: 1.4em;
            color: #2C3E50;
            line-height: 1.3;
            padding: 5px;
        }

        .btn-3d {
            border: none;
            color: white;
            padding: 12px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
            top: 0;
            margin: 4px;
            font-family: inherit;
            touch-action: manipulation; 
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .btn-blue { background-color: var(--btn-blue); box-shadow: 0 4px 0 var(--btn-blue-shadow); }
        .btn-red { background-color: var(--btn-red); box-shadow: 0 4px 0 var(--btn-red-shadow); }
        .btn-yellow { background-color: var(--btn-yellow); box-shadow: 0 4px 0 var(--btn-yellow-shadow); color: #5D4037; }
        .btn-green { background-color: var(--btn-green); box-shadow: 0 4px 0 var(--btn-green-shadow); }
        .btn-purple { background-color: var(--btn-purple); box-shadow: 0 4px 0 var(--btn-purple-shadow); }
        .btn-gray { background-color: #95A5A6; box-shadow: 0 4px 0 #7F8C8D; }
        
        .btn-nav { font-size: 1.2rem; padding: 5px; width: 44px; height: 44px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px;
            margin-top: 15px;
            background: #F4F6F7;
            padding: 10px;
            border-radius: 12px;
        }
        
        #wordBank {
            margin-top: 10px;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .feedback {
            font-weight: bold;
            font-size: 1.1em;
            min-height: 25px;
            margin: 5px 0;
        }
        .correct { color: var(--btn-green); }
        .wrong { color: var(--btn-red); }

        .full-text-drawer {
            margin-top: 20px;
            border-top: 2px dashed #BDC3C7;
            padding-top: 15px;
        }
        .full-text-content {
            text-align: left;
            background: #ECF0F1;
            padding: 10px;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            font-size: 0.9rem;
        }
        .text-sentence { cursor: pointer; padding: 4px; border-radius: 4px; display: inline-block; margin-bottom: 2px; }
        .text-sentence:hover { background-color: #D5DBDB; }
        .text-sentence.active { background-color: var(--btn-yellow); color: #fff; font-weight: bold; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 320px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-message {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #2C3E50;
        }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .w-100 { width: 100%; box-sizing: border-box; }

        /* DEBUG CONSOLE */
        #debugConsole {
            display: block; /* Visible for debugging */
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 10px;
            overflow-y: scroll;
            z-index: 9999;
            padding: 5px;
            box-sizing: border-box;
            text-align: left;
            pointer-events: none; /* Let clicks pass through */
        }
    </style>
</head>
<body>

<!-- On-screen console -->
<div id="debugConsole">Waiting for logs...</div>

<div class="main-container">
    <h1>
        <span class="title-word"><span class="color-e">E</span><span class="color-a">A</span><span class="color-s">S</span><span class="color-y">Y</span></span> 
        <span class="title-word"><span class="color-e">E</span><span class="color-y">N</span><span class="color-s">G</span><span class="color-a">L</span><span class="color-e">I</span><span class="color-s">S</span><span class="color-y">H</span></span>
    </h1>

    <div class="nav-bar">
        <button class="btn-3d btn-gray btn-nav" onclick="prevSentence()">⬅️</button>
        <div class="progress-indicator"><span id="currentStep">1</span> / <span id="totalSteps">12</span></div>
        <button class="btn-3d btn-green btn-nav" onclick="nextSentence()">➡️</button>
    </div>

    <div class="scene-container">
        <canvas id="sceneCanvas" width="600" height="250"></canvas>
    </div>

    <div class="game-area">
        <div id="targetText" class="sentence-display" style="display:none;"></div>
        <div id="playerArea" class="sentence-display">Загрузка...</div>
        <div class="feedback" id="feedback"></div>
        <div id="wordBank"></div>
    </div>

    <!-- Primary Action -->
    <button id="listenBtn" onclick="playSound()" class="btn-3d btn-blue w-100" style="font-size: 1.2rem; margin: 0 0 15px 0;">
        🔊 СЛУШАТЬ
    </button>

    <!-- Mode Selectors -->
    <div class="modes-grid">
        <button onclick="setMode('read')" class="btn-3d btn-yellow">📖 Читать</button>
        <button onclick="setMode('reveal')" class="btn-3d btn-purple">👁️ Слова</button>
        <button onclick="setMode('letter_by_letter')" class="btn-3d btn-red">🔤 Буквы</button>
        <button onclick="setMode('assemble')" class="btn-3d btn-green">🧩 Пазл</button>
        <button onclick="setMode('gaps')" class="btn-3d btn-blue">📝 Пропуски</button>
    </div>

    <!-- Bottom / Admin -->
    <div class="full-text-drawer">
        <button onclick="toggleFullText()" class="btn-3d btn-gray" style="font-size: 0.8rem; padding: 8px 15px; width: 100%;">📜 Показать весь текст</button>
        <div style="margin-top: 10px; text-align: right;">
            <button onclick="deleteCurrentSentence()" class="btn-3d btn-red" style="font-size: 0.8rem; padding: 8px 10px;">❌</button>
            <button onclick="resetStory()" class="btn-3d btn-yellow" style="font-size: 0.8rem; padding: 8px 10px;">↺</button>
        </div>
        <div id="fullTextContainer" class="full-text-content" style="margin-top:10px;"></div>
    </div>
</div>

<!-- Custom Modal -->
<div id="customModal" class="modal-overlay">
    <div class="modal-card">
        <div id="modalMessage" class="modal-message">Сообщение</div>
        <div class="modal-buttons">
            <button id="modalConfirmBtn" class="btn-3d btn-green">Да</button>
            <button id="modalCancelBtn" class="btn-3d btn-red" onclick="closeModal()">Нет</button>
        </div>
    </div>
</div>

<script>
    // --- DEBUG LOGGER ---
    const debugConsole = document.getElementById('debugConsole');
    function log(msg) {
        const d = document.createElement('div');
        d.textContent = "> " + msg;
        debugConsole.appendChild(d);
        debugConsole.scrollTop = debugConsole.scrollHeight;
        console.log(msg);
    }
    
    window.onerror = function(msg, url, line) {
        log("ERR: " + msg + " (L:" + line + ")");
    };

    log("Starting app...");

    const defaultStory = [
        "Ivanushka feels very frightened.",
        "He opens his mouth, ready to shout to his brothers.",
        "Then he sees a big beautiful brown horse running into the field.",
        "Ivanushka looks at the horse with his mouth still open.",
        "The horse has got a golden saddle and silver reins.",
        "It looks like a magic horse!",
        "It starts to eat the wheat, and Ivanushka walks quietly up to it and grabs the reins.",
        "Aha! I've got you! he cries.",
        "Oh, please let me go, says the horse.",
        "I can be your friend.",
        "If you ever need my help, just call me three times: Say Sivka-Burka, come!",
        "Ivanushka feels sorry for the horse and lets him go.",
        "But he does not tell his brothers about the horse.",
        "When they wake up, Ivanushka is looking up at the morning sun.",
        "Let's go home now, says Andrei.",
        "Ivanushka follows his brothers home, smiling to himself."
    ];

    let story = [];
    let currentIndex = 0;
    let currentMode = 'read'; 
    let revealIndex = 0;
    let letterWordIndex = 0;
    let letterState = 0; 
    const STORAGE_KEY = 'sivka_story_data_v1';

    const playerAreaEl = document.getElementById('playerArea');
    const wordBankEl = document.getElementById('wordBank');
    const feedbackEl = document.getElementById('feedback');
    const stepEl = document.getElementById('currentStep');
    const totalEl = document.getElementById('totalSteps');
    const listenBtnEl = document.getElementById('listenBtn');
    const fullTextContainer = document.getElementById('fullTextContainer');
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- Audio Init ---
    let voices = [];
    function initVoices() {
        if (!window.speechSynthesis) {
            log("Speech API missing");
            return;
        }
        voices = window.speechSynthesis.getVoices();
        log("Voices found: " + voices.length);
    }
    
    try {
        initVoices();
        if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = initVoices;
        }
    } catch (e) {
        log("Audio Setup Error: " + e.message);
    }

    // --- Safe Storage (CRITICAL FOR ANDROID) ---
    function safeGetItem(key) {
        try {
            return localStorage.getItem(key);
        } catch (e) {
            log("Storage READ blocked. Using temp memory.");
            return null;
        }
    }

    function safeSetItem(key, val) {
        try {
            localStorage.setItem(key, val);
        } catch (e) {
            log("Storage WRITE blocked.");
        }
    }

    // --- Modal Logic ---
    const modal = document.getElementById('customModal');
    const modalMessage = document.getElementById('modalMessage');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');

    function showConfirm(message, onYes) {
        modalMessage.innerText = message;
        modalConfirmBtn.onclick = () => {
            onYes();
            closeModal();
        };
        modalCancelBtn.style.display = 'inline-block';
        modalConfirmBtn.innerText = 'Да';
        modal.style.display = 'flex';
    }

    function showAlert(message) {
        modalMessage.innerText = message;
        modalConfirmBtn.onclick = closeModal;
        modalConfirmBtn.innerText = 'ОК';
        modalCancelBtn.style.display = 'none';
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    // --- App Logic ---

    function init() {
        try {
            loadFromStorage();
            if (!story || story.length === 0) {
                story = [...defaultStory];
                saveToStorage();
            }
            renderFullText();
            loadSentence();
            log("Ready!");
        } catch (e) {
            log("CRASH in init: " + e.message);
        }
    }

    const keywords = {
        'ivanushka': '🧑', 'he': '🧑', 'boy': '🧑', 'brother': '👱', 'brothers': '👱👱',
        'horse': '🐎', 'sivka': '🐎', 'sivka-burka': '🐎',
        'field': '🌾', 'wheat': '🌾', 'grass': '🌿',
        'sun': '☀️', 'morning': '☀️',
        'moon': '🌙', 'night': '🌙',
        'mouth': '👄', 'shout': '🗣️', 'cries': '🗣️',
        'open': '😮', 'frightened': '😱', 'scared': '😱',
        'saddle': '🪑', 'golden': '✨', 'silver': '🥈', 'magic': '✨',
        'home': '🏠', 'house': '🏠',
        'friend': '🤝', 'help': '🆘',
        'call': '📞', 'time': '⏳',
        'wake': '🥱', 'sleep': '😴',
        'smile': '🙂', 'smiling': '🙂'
    };

    function drawScene(text) {
        try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Sky
            ctx.fillStyle = '#EBF5FB';
            ctx.fillRect(0,0, canvas.width, canvas.height);

            // Ground
            ctx.beginPath();
            ctx.moveTo(0, 200);
            ctx.bezierCurveTo(200, 190, 400, 210, 600, 200);
            ctx.lineTo(600, 250);
            ctx.lineTo(0, 250);
            ctx.fillStyle = '#2ECC71';
            ctx.fill();
            ctx.strokeStyle = '#27AE60';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (!text) return;
            const lowerText = text.toLowerCase();
            let objectsToDraw = [];

            for (let word in keywords) {
                if (lowerText.includes(word)) {
                    objectsToDraw.push(keywords[word]);
                }
            }
            
            objectsToDraw = [...new Set(objectsToDraw)];
            if (objectsToDraw.length === 0) objectsToDraw.push('❓');

            const step = canvas.width / (objectsToDraw.length + 1);
            
            // Font Stack ensures Android emojis work
            ctx.font = "80px 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif"; 
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            
            objectsToDraw.forEach((emoji, index) => {
                const x = step * (index + 1);
                let y = 220; 
                if (emoji === '☀️' || emoji === '🌙') y = 100;
                ctx.fillText(emoji, x, y);
            });
        } catch (e) {
            log("Draw error: " + e.message);
        }
    }

    function loadFromStorage() {
        const saved = safeGetItem(STORAGE_KEY);
        if (saved) {
            try {
                story = JSON.parse(saved);
            } catch (e) {
                story = [...defaultStory];
            }
        } else {
            story = [...defaultStory];
        }
    }

    function saveToStorage() {
        safeSetItem(STORAGE_KEY, JSON.stringify(story));
    }

    function resetStory() {
        showConfirm("Сбросить историю в начало?", () => {
            story = [...defaultStory];
            saveToStorage();
            currentIndex = 0;
            renderFullText();
            loadSentence();
            feedbackEl.innerText = "";
        });
    }

    function deleteCurrentSentence() {
        if (story.length <= 1) return;
        showConfirm("Удалить это предложение?", () => {
            story.splice(currentIndex, 1);
            saveToStorage();
            if (currentIndex >= story.length) currentIndex = story.length - 1;
            renderFullText();
            loadSentence();
        });
    }

    function toggleFullText() {
        const el = document.getElementById('fullTextContainer');
        if (el.style.display === 'none' || el.style.display === '') {
            el.style.display = 'block';
        } else {
            el.style.display = 'none';
        }
    }

    function renderFullText() {
        fullTextContainer.innerHTML = story.map((sent, idx) => {
            const isActive = idx === currentIndex ? 'active' : '';
            const safeSent = sent.replace(/'/g, "\'" );
            return `<span class="text-sentence ${isActive}" onclick="jumpTo(${idx})">${sent}</span>`;
        }).join(' ');
    }

    function jumpTo(index) {
        currentIndex = index;
        loadSentence();
    }

    function setMode(mode) {
        currentMode = mode;
        loadSentence();
    }

    function prevSentence() {
        if (currentIndex > 0) {
            currentIndex--;
            loadSentence();
        }
    }

    function nextSentence() {
        if (currentIndex < story.length - 1) {
            currentIndex++;
            loadSentence();
        } else {
            feedbackEl.innerText = "Молодец! Конец истории!";
            feedbackEl.className = "feedback correct";
        }
    }

    function playSound() {
        if (!window.speechSynthesis) {
            showAlert("Ваш браузер не поддерживает озвучку");
            return;
        }
        speechSynthesis.cancel();
        const text = story[currentIndex];
        const utterance = new SpeechSynthesisUtterance(text);
        
        const enVoice = voices.find(v => v.lang.startsWith('en-GB')) || 
                        voices.find(v => v.lang.startsWith('en-US'));
        if (enVoice) utterance.voice = enVoice;
        
        utterance.lang = 'en-GB';
        utterance.rate = 0.8;
        listenBtnEl.classList.add('active');
        utterance.onend = () => listenBtnEl.classList.remove('active');
        utterance.onerror = (e) => {
            listenBtnEl.classList.remove('active');
            log("Speech Err: " + e.error);
        };
        
        speechSynthesis.speak(utterance);
    }

    function loadSentence() {
        totalEl.innerText = story.length;
        stepEl.innerText = currentIndex + 1;
        feedbackEl.innerText = "";
        const text = story[currentIndex];
        
        drawScene(text);
        renderFullText(); 

        wordBankEl.innerHTML = '';
        playerAreaEl.innerHTML = '';

        if (currentMode === 'read') {
            playerAreaEl.innerText = text;
        } 
        else if (currentMode === 'assemble') {
            let words = text.split(' ');
            let shuffled = [...words].sort(() => Math.random() - 0.5);
            shuffled.forEach(word => {
                let btn = document.createElement('button');
                btn.className = 'btn-3d btn-yellow';
                btn.style.padding = '8px 15px';
                btn.innerText = word;
                btn.onclick = () => {
                    playerAreaEl.innerText += (playerAreaEl.innerText ? " " : "") + word;
                    btn.disabled = true;
                    btn.style.opacity = 0.5;
                    btn.style.boxShadow = 'none';
                    btn.style.top = '4px';
                    checkAssemble(text);
                };
                wordBankEl.appendChild(btn);
            });
            let resetBtn = document.createElement('button');
            resetBtn.innerText = "↺";
            resetBtn.className = "btn-3d btn-gray";
            resetBtn.onclick = loadSentence;
            wordBankEl.appendChild(resetBtn);
        }
        else if (currentMode === 'gaps') {
            let words = text.split(' ');
            let html = "";
            words.forEach(word => {
                if (word.length > 3 && Math.random() > 0.4) {
                    html += `<input type="text" data-answer="${word.replace(/[.,!?:;]/g, '')}" 
                             style="width:${word.length*12}px; border:2px solid #BDC3C7; padding:5px; border-radius:8px; margin:2px; font-family:inherit; font-size:1rem;" 
                             placeholder="?"> `;
                } else {
                    html += word + " ";
                }
            });
            playerAreaEl.innerHTML = html;
            let checkBtn = document.createElement('button');
            checkBtn.innerText = "Проверить";
            checkBtn.className = "btn-3d btn-purple";
            checkBtn.onclick = checkGaps;
            wordBankEl.appendChild(checkBtn);
        }
        else if (currentMode === 'reveal') {
            revealIndex = 0;
            playerAreaEl.innerHTML = '<span style="color:#BDC3C7; font-style:italic;">...</span>';
            let revealBtn = document.createElement('button');
            revealBtn.innerText = "👁️ След. слово";
            revealBtn.className = "btn-3d btn-blue";
            revealBtn.onclick = () => revealNextWord(text);
            
            let resetBtn = document.createElement('button');
            resetBtn.innerText = "↺";
            resetBtn.className = "btn-3d btn-gray";
            resetBtn.onclick = loadSentence;
            wordBankEl.appendChild(revealBtn);
            wordBankEl.appendChild(resetBtn);
        }
        else if (currentMode === 'letter_by_letter') {
            letterWordIndex = 0;
            letterState = 0;
            playerAreaEl.innerHTML = '<span style="color:#BDC3C7; font-style:italic;">...</span>';
            let revealBtn = document.createElement('button');
            revealBtn.innerText = "🔤 След. буква";
            revealBtn.className = "btn-3d btn-red";
            revealBtn.onclick = () => revealNextLetterStep(text);
            
            let resetBtn = document.createElement('button');
            resetBtn.innerText = "↺";
            resetBtn.className = "btn-3d btn-gray";
            resetBtn.onclick = loadSentence;
            wordBankEl.appendChild(revealBtn);
            wordBankEl.appendChild(resetBtn);
        }
    }

    function revealNextWord(originalText) {
        const words = originalText.split(' ');
        if (revealIndex < words.length) {
            if (revealIndex === 0) playerAreaEl.innerText = "";
            playerAreaEl.innerText += (revealIndex > 0 ? " " : "") + words[revealIndex];
            revealIndex++;
            if (revealIndex === words.length) {
                feedbackEl.innerText = "Отлично!";
                feedbackEl.className = "feedback correct";
                playSound();
            }
        }
    }

    function revealNextLetterStep(originalText) {
        const words = originalText.split(' ');
        if (letterWordIndex >= words.length) return;

        let displayText = "";
        for (let i = 0; i < letterWordIndex; i++) displayText += words[i] + " ";

        if (letterState === 0) {
            if (words[letterWordIndex].length > 0) displayText += words[letterWordIndex][0]; 
            letterState = 1;
        } else {
            displayText += words[letterWordIndex];
            letterWordIndex++;
            letterState = 0;
            if (letterWordIndex === words.length) {
                feedbackEl.innerText = "Супер!";
                feedbackEl.className = "feedback correct";
                playSound();
            }
        }
        playerAreaEl.innerText = displayText;
    }

    function checkAssemble(original) {
        if (playerAreaEl.innerText === original) {
            feedbackEl.innerText = "Верно! 🎉";
            feedbackEl.className = "feedback correct";
            playSound();
        } else if (playerAreaEl.innerText.length >= original.length) {
            feedbackEl.innerText = "Попробуй еще раз!";
            feedbackEl.className = "feedback wrong";
        }
    }

    function checkGaps() {
        let inputs = playerAreaEl.querySelectorAll('input');
        let allCorrect = true;
        inputs.forEach(input => {
            let val = input.value.trim().toLowerCase();
            let ans = input.dataset.answer.toLowerCase();
            if (val.replace(/[.,!]/g, '') === ans) {
                input.style.borderColor = "#2ECC71";
                input.style.backgroundColor = "#E9F7EF";
            } else {
                input.style.borderColor = "#E74C3C";
                input.style.backgroundColor = "#FDEDEC";
                allCorrect = false;
            }
        });

        if (allCorrect) {
            feedbackEl.innerText = "Все верно! 🌟";
            feedbackEl.className = "feedback correct";
            playSound();
        } else {
            feedbackEl.innerText = "Проверь красные поля";
            feedbackEl.className = "feedback wrong";
        }
    }

    init();
    
    // Telegram Mini App Init
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
</script>
</body>
</html>
