<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivka-Burka Trainer</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f0f8ff; padding: 20px; text-align: center; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #2c3e50; }
        .sentence-display { font-size: 1.5em; color: #333; margin: 20px 0; min-height: 60px; line-height: 1.4; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 10px; cursor: pointer; margin: 5px; transition: 0.2s; }
        button:hover { background-color: #2980b9; }
        button.word-btn { background-color: #e67e22; margin: 5px; }
        button.word-btn:disabled { background-color: #bdc3c7; cursor: default; }
        .controls { margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .feedback { font-weight: bold; font-size: 1.2em; margin-top: 10px; height: 30px; }
        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }
        .progress { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 10px; }
        
        /* Styles for Full Text View */
        .full-text-area { text-align: left; background: #fff; border: 2px dashed #bdc3c7; padding: 15px; margin: 20px 0; border-radius: 10px; max-height: 200px; overflow-y: auto; display: none; }
        .text-sentence { cursor: pointer; padding: 2px 5px; border-radius: 4px; transition: background 0.2s; display: inline; margin-right: 4px; }
        .text-sentence:hover { background-color: #eaf2f8; }
        .text-sentence.active { background-color: #f1c40f; color: #fff; font-weight: bold; }
        
        .admin-controls { margin-top: 15px; font-size: 0.8rem; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; border-radius: 5px; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-warning { background-color: #f39c12; }
        .btn-warning:hover { background-color: #d35400; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐴 Sivka-Burka</h1>
    <div class="progress">Предложение <span id="currentStep">1</span> из <span id="totalSteps">12</span></div>
    
    <!-- Canvas Area -->
    <canvas id="sceneCanvas" width="600" height="300" style="background: white; border: 2px solid #333; border-radius: 10px; margin: 20px auto; display: block;"></canvas>

    <div id="gameArea">
        <div id="targetText" class="sentence-display" style="display:none;"></div>
        <div id="playerArea" class="sentence-display">Нажми "Старт"</div>
        <div id="wordBank"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
        <button onclick="prevSentence()" style="background-color: #7f8c8d;">⬅️ Назад</button>
        <button id="listenBtn" onclick="playSound()">🔊 Прослушать</button>
        <button onclick="nextSentence()" style="background-color: #27ae60;">Следующее ➡️</button>
        <br><br>
        <button onclick="setMode('assemble')">🧩 Собрать слова</button>
        <button onclick="setMode('gaps')">📝 Вставить пропуски</button>
        <button onclick="setMode('reveal')">👁️ По слову</button>
        <button onclick="setMode('read')">📖 Просто читать</button>
        
        <div class="admin-controls">
            <button onclick="deleteCurrentSentence()" class="btn-small btn-danger">❌ Удалить предложение</button>
            <button onclick="resetStory()" class="btn-small btn-warning">↺ Сброс текста</button>
        </div>
    </div>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
    
    <button onclick="toggleFullText()" class="btn-small" style="background-color: #95a5a6; margin-bottom: 10px;">📜 Показать/Скрыть весь текст</button>
    <div id="fullTextContainer" class="full-text-area"></div>
</div>

<script>
    // Исходный текст (по умолчанию)
    const defaultStory = [
        "Ivanushka feels very frightened.",
        "He opens his mouth, ready to shout to his brothers.",
        "Then he sees a big beautiful brown horse running into the field.",
        "Ivanushka looks at the horse with his mouth still open.",
        "The horse has got a golden saddle and silver reins.",
        "It looks like a magic horse!",
        "It starts to eat the wheat, and Ivanushka walks quietly up to it and grabs the reins.",
        "Aha! I've got you! he cries.",
        "Oh, please let me go, says the horse.",
        "I can be your friend.",
        "If you ever need my help, just call me three times: Say Sivka-Burka, come!",
        "Ivanushka feels sorry for the horse and lets him go.",
        "But he does not tell his brothers about the horse.",
        "When they wake up, Ivanushka is looking up at the morning sun.",
        "Let's go home now, says Andrei.",
        "Ivanushka follows his brothers home, smiling to himself."
    ];

    let story = [];
    let currentIndex = 0;
    let currentMode = 'read'; // read, assemble, gaps, reveal
    let revealIndex = 0; // Для режима "по слову"
    const STORAGE_KEY = 'sivka_story_data_v1';

    const targetTextEl = document.getElementById('targetText');
    const playerAreaEl = document.getElementById('playerArea');
    const wordBankEl = document.getElementById('wordBank');
    const feedbackEl = document.getElementById('feedback');
    const stepEl = document.getElementById('currentStep');
    const totalEl = document.getElementById('totalSteps');
    const listenBtnEl = document.getElementById('listenBtn');
    const fullTextContainer = document.getElementById('fullTextContainer');
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');
    
    // "Разогрев" синтеза речи
    let audioContextInitialized = false;

    function warmUpAudio() {
        if (!audioContextInitialized) {
            window.speechSynthesis.getVoices();
            const utterance = new SpeechSynthesisUtterance('');
            utterance.volume = 0;
            speechSynthesis.speak(utterance);
            if (!speechSynthesis.pending && !speechSynthesis.speaking) {
                // audioContextInitialized = true; // Опционально
            }
        }
    }

    // Попытка 1: Сразу при загрузке
    warmUpAudio();

    // Попытка 2: При первом клике
    document.addEventListener('click', function initAudio() {
        if (!audioContextInitialized) {
            warmUpAudio();
            audioContextInitialized = true;
            document.removeEventListener('click', initAudio);
        }
    });

    function init() {
        loadFromStorage();
        if (story.length === 0) {
            resetStory();
        } else {
            renderFullText();
            loadSentence();
        }
    }
    
    // --- Canvas "Раскраска" ---
    
    // Словарь объектов: слово -> эмодзи
    const keywords = {
        'ivanushka': '🧑', 'he': '🧑', 'boy': '🧑', 'brother': '👱', 'brothers': '👱👱',
        'horse': '🐎', 'sivka': '🐎', 'sivka-burka': '🐎',
        'field': '🌾', 'wheat': '🌾', 'grass': '🌿',
        'sun': '☀️', 'morning': '☀️',
        'moon': '🌙', 'night': '🌙',
        'mouth': '👄', 'shout': '🗣️', 'cries': '🗣️',
        'open': '😮', 'frightened': '😱', 'scared': '😱',
        'saddle': '🪑', 'golden': '✨', 'silver': '🥈', 'magic': '✨',
        'home': '🏠', 'house': '🏠',
        'friend': '🤝', 'help': '🆘',
        'call': '📞', 'time': '⏳',
        'wake': '🥱', 'sleep': '😴',
        'smile': '🙂', 'smiling': '🙂'
    };

    function drawScene(text) {
        // Очистка
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. Рисуем "землю" (горизонт)
        ctx.beginPath();
        ctx.moveTo(0, 250);
        ctx.bezierCurveTo(200, 240, 400, 260, 600, 250);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. Ищем ключевые слова
        const lowerText = text.toLowerCase();
        let objectsToDraw = [];

        for (let word in keywords) {
            if (lowerText.includes(word)) {
                objectsToDraw.push(keywords[word]);
            }
        }
        
        objectsToDraw = [...new Set(objectsToDraw)];
        
        if (objectsToDraw.length === 0) {
            objectsToDraw.push('❓');
        }

        // 3. Рисуем объекты
        const step = canvas.width / (objectsToDraw.length + 1);
        
        ctx.font = "100px serif"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        
        objectsToDraw.forEach((emoji, index) => {
            const x = step * (index + 1);
            let y = 250; 
            
            if (emoji === '☀️' || emoji === '🌙') {
                y = 100;
            }
            
            ctx.fillText(emoji, x, y);
        });
    }

    // --- Управление данными ---

    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            story = JSON.parse(saved);
        } else {
            story = [...defaultStory];
        }
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(story));
    }

    function resetStory() {
        if (confirm("Вы уверены, что хотите сбросить текст к исходному состоянию?")) {
            story = [...defaultStory];
            saveToStorage();
            currentIndex = 0;
            renderFullText();
            loadSentence();
            feedbackEl.innerText = "Текст сброшен!";
            feedbackEl.className = "feedback";
        }
    }

    function deleteCurrentSentence() {
        if (story.length <= 1) {
            alert("Нельзя удалить последнее предложение!");
            return;
        }
        if (confirm("Удалить текущее предложение?")) {
            story.splice(currentIndex, 1);
            saveToStorage();
            if (currentIndex >= story.length) {
                currentIndex = story.length - 1;
            }
            renderFullText();
            loadSentence();
            feedbackEl.innerText = "Предложение удалено";
            feedbackEl.className = "feedback correct";
        }
    }

    // --- Интерфейс ---

    function toggleFullText() {
        if (fullTextContainer.style.display === 'none' || fullTextContainer.style.display === '') {
            fullTextContainer.style.display = 'block';
        } else {
            fullTextContainer.style.display = 'none';
        }
    }

    function renderFullText() {
        fullTextContainer.innerHTML = story.map((sent, idx) => {
            const isActive = idx === currentIndex ? 'active' : '';
            const safeSent = sent.replace(/'/g, "\\'"); 
            return `<span class="text-sentence ${isActive}" onclick="jumpTo(${idx})">${sent}</span>`;
        }).join(' ');
    }

    function jumpTo(index) {
        currentIndex = index;
        loadSentence();
    }

    function setMode(mode) {
        currentMode = mode;
        loadSentence();
    }

    function prevSentence() {
        if (currentIndex > 0) {
            currentIndex--;
            loadSentence();
        }
    }

    function nextSentence() {
        if (currentIndex < story.length - 1) {
            currentIndex++;
            loadSentence();
        } else {
            feedbackEl.innerText = "Молодец! Текст пройден!";
            feedbackEl.className = "feedback correct";
        }
    }

    function playSound() {
        speechSynthesis.cancel();

        const text = story[currentIndex];
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-GB';
        utterance.rate = 0.8;
        
        listenBtnEl.disabled = true;
        listenBtnEl.style.opacity = "0.5";
        listenBtnEl.style.cursor = "not-allowed";

        utterance.onend = () => {
            listenBtnEl.disabled = false;
            listenBtnEl.style.opacity = "1";
            listenBtnEl.style.cursor = "pointer";
        };

        utterance.onerror = () => {
            listenBtnEl.disabled = false;
            listenBtnEl.style.opacity = "1";
            listenBtnEl.style.cursor = "pointer";
        };

        speechSynthesis.speak(utterance);
    }

    function loadSentence() {
        totalEl.innerText = story.length;
        stepEl.innerText = currentIndex + 1;
        feedbackEl.innerText = "";
        const text = story[currentIndex];
        
        drawScene(text);
        renderFullText(); 

        wordBankEl.innerHTML = '';
        playerAreaEl.innerHTML = '';
        targetTextEl.style.display = 'none';

        if (currentMode === 'read') {
            playerAreaEl.innerText = text;
        } 
        else if (currentMode === 'assemble') {
            let words = text.split(' ');
            let shuffled = [...words].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(word => {
                let btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.innerText = word;
                btn.onclick = () => {
                    playerAreaEl.innerText += (playerAreaEl.innerText ? " " : "") + word;
                    btn.disabled = true;
                    checkAssemble(text);
                };
                wordBankEl.appendChild(btn);
            });
            
            let resetBtn = document.createElement('button');
            resetBtn.innerText = "↺ Сброс";
            resetBtn.style.backgroundColor = "#95a5a6";
            resetBtn.style.fontSize = "0.8rem";
            resetBtn.onclick = loadSentence;
            wordBankEl.appendChild(document.createElement('br'));
            wordBankEl.appendChild(resetBtn);
        }
        else if (currentMode === 'gaps') {
            let words = text.split(' ');
            let html = "";
            
            words.forEach((word, index) => {
                if (word.length > 3 && Math.random() > 0.4) {
                    html += `<input type="text" data-answer="${word.replace(/[.,!?:;]/g, '')}" 
                             style="width:${word.length*10}px; border:1px solid #ccc; padding:5px; border-radius:5px; margin:2px;" 
                             placeholder="?"> `;
                } else {
                    html += word + " ";
                }
            });
            
            playerAreaEl.innerHTML = html;
            
            let checkBtn = document.createElement('button');
            checkBtn.innerText = "Проверить";
            checkBtn.style.backgroundColor = "#8e44ad";
            checkBtn.onclick = checkGaps;
            wordBankEl.appendChild(checkBtn);
        }
        else if (currentMode === 'reveal') {
            revealIndex = 0;
            playerAreaEl.innerHTML = '<span style="color:#bdc3c7; font-style:italic;">(Нажми "Показать слово")</span>';
            
            let revealBtn = document.createElement('button');
            revealBtn.innerText = "👁️ Показать слово";
            revealBtn.style.backgroundColor = "#34495e";
            revealBtn.onclick = () => revealNextWord(text);
            
            let resetBtn = document.createElement('button');
            resetBtn.innerText = "↺ Сначала";
            resetBtn.style.backgroundColor = "#95a5a6";
            resetBtn.onclick = loadSentence;

            wordBankEl.appendChild(revealBtn);
            wordBankEl.appendChild(resetBtn);
        }
    }

    function revealNextWord(originalText) {
        const words = originalText.split(' ');
        if (revealIndex < words.length) {
            if (revealIndex === 0) {
                playerAreaEl.innerText = ""; // Очистить заглушку
            }
            playerAreaEl.innerText += (revealIndex > 0 ? " " : "") + words[revealIndex];
            revealIndex++;
            
            if (revealIndex === words.length) {
                feedbackEl.innerText = "Прочитано! 🎉";
                feedbackEl.className = "feedback correct";
                playSound();
            }
        }
    }

    function checkAssemble(original) {
        if (playerAreaEl.innerText === original) {
            feedbackEl.innerText = "Правильно! 🎉";
            feedbackEl.className = "feedback correct";
            playSound();
        } else if (playerAreaEl.innerText.length >= original.length) {
            feedbackEl.innerText = "Ошибка, попробуй еще раз";
            feedbackEl.className = "feedback wrong";
        }
    }

    function checkGaps() {
        let inputs = playerAreaEl.querySelectorAll('input');
        let allCorrect = true;
        
        inputs.forEach(input => {
            let val = input.value.trim().toLowerCase();
            let ans = input.dataset.answer.toLowerCase();
            if (val.replace(/[.,!]/g, '') === ans) {
                input.style.borderColor = "#27ae60";
                input.style.backgroundColor = "#eafaf1";
            } else {
                input.style.borderColor = "#c0392b";
                input.style.backgroundColor = "#fadbd8";
                allCorrect = false;
            }
        });

        if (allCorrect) {
            feedbackEl.innerText = "Отлично! Все верно! 🌟";
            feedbackEl.className = "feedback correct";
            playSound();
        } else {
            feedbackEl.innerText = "Есть ошибки, исправь красные поля";
            feedbackEl.className = "feedback wrong";
        }
    }

    init();
</script>

</body>
</html>
